// Reserve a granule on each of the client-computed (CRUSH/HRW) targets for one stripe.
// The client supplies the target set it derived from placement; KAS picks a free granule
// on each. Used by the decentralized write path instead of the central window reserve.
message ReserveComputedPlacementRequest {
  string bucket_id = 1;
  repeated string target_ids = 2;
}

message ReserveComputedPlacementReply {
  PlacementReservationRecord reservation = 1;
}

message ReserveObjectWriteWindowReply {
  repeated FragmentPlan fragment_plans = 1;
}

