  string name = 4;
  NamespaceEntryKind kind = 5;
  string path = 6;
  // Object byte length, denormalized at commit so listings carry size
  // without a per-object resolve. 0 for directories/collections or unknown.
  uint64 size_bytes = 7;
}

message ShardMapEntry {
  string shard_id = 1;
  string namespace_id = 2;
  string path_prefix_start = 3;
  string path_prefix_end = 4;
  string leader_endpoint = 5;
  repeated string replica_endpoints = 6;
  uint64 revision = 7;
}

message MetadataEvent {
  uint64 revision = 1;
  string namespace_id = 2;
  string entry_id = 3;
  string parent_entry_id = 4;
  string entry_path = 5;
  MetadataEventKind event_kind = 6;
  string bucket_id = 7;
  string object_entry_id = 8;
  string version_id = 9;
  string summary = 10;
  string json_payload = 11;
}

message MetadataInvalidationEvent {
  string namespace_id = 1;
  string bucket_id = 2;
  string key = 3;
  string entry_id = 4;
  string parent_entry_id = 5;
  MetadataEventKind event_kind = 6;
  string version_id = 7;
}

message ObjectHead {
  string object_entry_id = 1;
  string current_version_id = 2;
  uint64 revision = 3;
  // Monotonic per-object version counter, distinct from `revision` (an internal
  // sweep timestamp). Bumped on every committed version; the source of truth for
  // the next version a write should use. Old heads decode it as 0.
  uint32 version = 4;
  // Object-level state denormalized onto the head so a reader resolving an object
  // needs only the head (plus the bucket's EC profile) to know its geometry, with
  // no manifest fetch. logical_length_bytes + the EC profile give stripe count and
  // tail sizing; topology_epoch records the placement topology the version was
  // committed against (a staleness/rebalance hint). Old heads decode these as 0/empty.
  uint64 logical_length_bytes = 5;
  string ec_profile_id = 6;
  uint64 topology_epoch = 7;
}

message EcProfile {
  string id = 1;
  string codec_id = 2;
  uint32 data_fragments = 3;
  uint32 parity_fragments = 4;
  uint32 fragment_bytes = 5;
  FailureDomain failure_domain = 6;
}

// Routes objects at or under a size bound to a storage class at write-begin. The
// first route (ascending max_object_bytes) whose bound admits the object's logical
// length selects the profile; objects above every bound use the bucket's default
// profile family. Routes are explicit: a routed profile is used verbatim — no
// family-shrink pass and no minimum-fragment floor — so a replicated small-object
// class (data_fragments=1) can turn a 10-fragment EC write into 3 granule-filling
// replica writes.
message SizeClassRoute {
  uint64 max_object_bytes = 1;
  string ec_profile_id = 2;
}

message BucketRecord {
  string bucket_id = 1;
  string ec_profile_id = 2;
  string namespace_id = 3;
  string parent_entry_id = 4;
  string bucket_entry_id = 5;
  repeated SizeClassRoute size_class_routes = 6;
}

message FragmentPlan {
  uint32 fragment_index = 1;
  bytes chunk_id = 2;
  string target_id = 3;
  string endpoint = 4;
  uint64 granule_index = 5;
  uint32 generation = 6;
  uint32 stripe_index = 7;
}

message StripeManifest {
  repeated FragmentPlan fragments = 1;
}

message FragmentRef {
  uint32 stripe_index = 1;
  uint32 fragment_index = 2;
}

message ObjectVersionManifest {
  string version_id = 1;
  string bucket_id = 2;
  string key = 3;
  uint64 logical_length_bytes = 4;
  string ec_profile_id = 5;
  repeated StripeManifest stripes = 6;
  string namespace_id = 7;
  string object_entry_id = 8;
  string bucket_entry_id = 9;
}

message WriteIntent {
  string intent_id = 1;
  string version_id = 2;
  string bucket_id = 3;
  string key = 4;
  uint64 logical_length_bytes = 5;
  string ec_profile_id = 6;
  uint32 stripe_count = 7;
  repeated FragmentPlan fragment_plans = 8;
  uint64 expires_at_unix_ms = 9;
  WriteIntentState state = 10;
  string reservation_id = 11;
  string namespace_id = 12;
  string object_entry_id = 13;
  string bucket_entry_id = 14;
  repeated string reservation_ids = 15;
  repeated FragmentWriteStatus fragment_status = 16;
