  string intent_id = 1;
  repeated FragmentRef successful_fragments = 2;
}

message CommitObjectWriteWindowReply {}

message CommitObjectWriteRequest {
  string intent_id = 1;
  repeated FragmentRef successful_fragments = 2;
}

message CommitObjectWriteReply {
  ObjectVersionManifest manifest = 1;
}

// Single-shot object lifecycle. BeginObject mints the monotonic object_id + numeric
// version up front (no central write-intent row); CommitObject is one transaction that
// writes the manifest, appends the per-target reverse log, and CAS-flips the head.
// object_id is u32 to match the on-media slot header; widen later for >4B-object scale.
message BeginObjectRequest {
  string namespace_id = 1;
  string bucket_id = 2;
  string key = 3;
  // With resolve_write_context: sizes the effective EC profile + stripe_count so the
  // reply replaces InitiateObjectWrite entirely on the decentralized path (one control
  // RPC per write instead of two, and no write-intent row is ever created).
  uint64 logical_length_bytes = 4;
  // False preserves the original mint-only behavior byte-for-byte (old clients).
  bool resolve_write_context = 5;
}

message BeginObjectReply {
  uint32 object_id = 1;
  uint32 version = 2;
  EcProfile ec_profile = 3;
  uint64 topology_epoch = 4;
  // Populated only when the request set resolve_write_context (stripe_count == 0
  // tells a new client it is talking to a server that predates the merged begin).
  uint32 stripe_count = 5;
  string namespace_id = 6;
  string parent_entry_id = 7;
  string parent_path = 8;
  string bucket_entry_id = 9;
}

// Abandons an in-flight decentralized write: flips its pending-version marker to the
// reclaiming state and clears the write lease in one transaction, so the orphan-version
// reaper retires the write's rows/granules without waiting out the lease TTL. Idempotent:
// an absent or already-reclaiming marker returns OK (commit/forfeit races are settled by
// the marker's FDB serialization, exactly one side wins).
message ForfeitObjectWriteRequest {
  uint32 object_id = 1;
  uint32 version = 2;
}

message ForfeitObjectWriteReply {}

message CommitObjectRequest {
  uint32 object_id = 1;
  string namespace_id = 2;
  string bucket_id = 3;
  string key = 4;
  uint32 version = 5;
  ObjectVersionManifest manifest = 6;
  // Compare-and-swap witness: the version the committer believes is currently
  // published for (bucket_id, key). 0 means "the object must not already exist".
  // The commit succeeds only if the live head's version equals this; a retried
  // commit whose own version already won is treated as success.
  uint32 expected_prior_version = 7;
  // Parent directory the committed object entry hangs under, resolved (and
  // auto-created) up front by the write-intent path. Carried here so the commit
  // transaction places the namespace entry without re-walking the path tree.
  string parent_entry_id = 8;
  string parent_path = 9;
  // Placement topology epoch the client computed this object's placement against,
  // recorded on the head as a staleness/rebalance hint. 0 when the committer does
  // not compute placement.
  uint64 topology_epoch = 10;
  // When true the commit does NOT persist the object manifest blob: the per-target
  // reverse log is the sole per-fragment record and reads reconstruct the layout by
  // computation. Set by the decentralized write path; the manifest-backed path keeps
  // it false so its objects remain manifest-readable.
  bool omit_manifest = 11;
  // When true the commit requires this version's pending-version marker to still be
  // live in the writing state (a BeginObject preceded it), and rejects with
  // FAILED_PRECONDITION once the version was forfeited, claimed by the orphan
  // reaper, or had a granule reclaimed by GC (per-version reclaim fence). Set by
  // the decentralized path; tools committing without BeginObject leave it false.
  bool require_pending_version_marker = 12;
  // Alternative to `manifest`: the target-reported landing record per fragment.
  // The server derives the reverse-log and occupancy rows from these (chunk ids
  // are recomputable pure functions and are never stored), so the request skips
  // the full manifest marshalling. Exactly one of `manifest` / `landed` is set;
  // `landed` implies omit_manifest semantics (there is no blob to persist).
  repeated LandedFragmentRow landed = 13;
  // Head fields accompanying `landed` (the manifest normally carries these).
  uint64 object_logical_length_bytes = 14;
  string ec_profile_id = 15;
  // Namespace entry id for the committed object; empty means the server mints one.
  string object_entry_id = 16;
}

// One fragment's landing record as the target reported it: everything the commit
// transaction needs to write that fragment's reverse-log row and occupancy markers.
message LandedFragmentRow {
  string target_id = 1;
  uint32 stripe_index = 2;
  uint32 fragment_index = 3;
  uint64 granule_index = 4;
  uint32 generation = 5;
}

message CommitObjectReply {
  ObjectHead head = 1;
}

// --- Append-then-seal segmented commit (objects too large for one 10 MB FDB txn) ---
// A single large object's commit is streamed as N ManifestSegment messages (each a batch of
// stripes whose per-fragment reverse-log + occupancy writes fit in one bounded FDB txn),
// terminated by a CommitObjectSeal that flips the head atomically. Decentralized path only:
// omit_manifest semantics mean the reverse-log IS the manifest, so there is no manifest blob to
// chunk and the only O(fragments) writes are the reverse-log + occupancy the segments carry. The
// object becomes resolvable only at the seal — pre-seal segments are inert (no head references
// them) and stay protected by the write's pending-version marker, which every segment renews.
// If the write dies unsealed, the marker expires and the orphan-version reaper clears the
// segments' records, after which the granule GC frees the space; a seal arriving after that
// reclamation fails with FAILED_PRECONDITION (the object must be rewritten). A seal with no
// prior segments is rejected (the object would have no fragments).
message CommitObjectSegment {
  oneof content {
    ManifestSegment manifest_segment = 1;
    CommitObjectSeal seal = 2;
  }
}

// A batch of stripes (each with its FragmentPlan list) whose reverse-log + occupancy writes the
// KMS applies in one bounded transaction. version_id ties every segment to one object version.
message ManifestSegment {
  string version_id = 1;
  repeated StripeManifest stripes = 2;
}

// Terminates the stream and atomically flips the head. Carries the O(1) head metadata the
// single-shot CommitObjectRequest carried, minus the manifest (the segments already wrote the
// per-fragment records). object_entry_id may be empty (KMS mints one), matching the unary path.
message CommitObjectSeal {
  uint32 object_id = 1;
  string namespace_id = 2;
  string bucket_id = 3;
  string key = 4;
  uint32 version = 5;
  uint32 expected_prior_version = 6;
  string parent_entry_id = 7;
  string parent_path = 8;
  uint64 topology_epoch = 9;
  uint64 logical_length_bytes = 10;
  string ec_profile_id = 11;
  string version_id = 12;
  string object_entry_id = 13;
}

// Extends a per-object write lease so a long multi-TiB write outlives it (the client heartbeats
// this during the write; the seal clears the lease). The lease is keyed by object_id. Renewal
// also pushes the write's pending-version marker forward. Fails with FAILED_PRECONDITION — and
// re-issues nothing — once the write has forfeited (its version reaped after the lease lapsed):
// a zombie writer's heartbeat must not stall reclamation.
message RenewWriteLeaseRequest {
  uint32 object_id = 1;
  uint64 lease_ttl_ms = 2;
}
message RenewWriteLeaseReply {
  uint64 new_expires_at_unix_ms = 1;
}

// Batches many independent object commits into one RPC so the KMS folds them into a
// single FoundationDB transaction: one read-version, one resolver pass, one TLog-quorum
// fsync, and one gRPC round-trip amortized across N objects. Each element is a complete,
// self-contained CommitObjectRequest; per-object compare-and-swap is still enforced
// individually, so one object's CAS miss rejects only that object, not the batch.
message MultiCommitObjectRequest {
  repeated CommitObjectRequest commits = 1;
}

message MultiCommitObjectResult {
  // Index into the request's `commits`, so partial failures map back to the right object.
  uint32 index = 1;
  ObjectHead head = 2;        // set on success
  string error = 3;           // set on per-object failure (e.g. CAS mismatch)
  uint32 grpc_status_code = 4; // tonic Code as i32, for the client to reconstruct status
}

message MultiCommitObjectReply {
  repeated MultiCommitObjectResult results = 1;
}

